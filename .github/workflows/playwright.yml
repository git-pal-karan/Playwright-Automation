name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Matrix allows running multiple environments in parallel
    strategy:
      matrix:
        env: [qa, staging]      # add prod if needed
        headless: [true]        # change to [true, false] if you want headed too

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run Playwright tests with dynamic environment and headless settings
      - name: Run Playwright tests
        run: npx playwright test
        env:
          ENV: ${{ matrix.env }}
          HEADLESS: ${{ matrix.headless }}

      # 6. Upload HTML report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30
